name: tests

# CI for the plugin's host-side Elixir surface — the same gate mob core runs,
# so a PR gets a green check instead of relying only on each contributor's
# local pre-push hook. The Android native code (zig/Kotlin) is compiled by
# the host app at deploy time, not here. The iOS NIF (ObjC over CoreMIDI)
# also builds for macOS: the macos job compiles it and runs it against real
# CoreMIDI (test/mob_midi_ios_host_test.exs, tagged :macos_only).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.19'
            otp: '28'
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps + _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors

      - name: Format check
        run: mix format --check-formatted

      - name: Credo (strict)
        run: mix credo --strict

      - name: Tests
        run: mix test --exclude macos_only --exclude requires_zig

  macos:
    name: iOS NIF on macOS CoreMIDI
    runs-on: macos-15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      # erlef/setup-beam has no macOS support.
      - name: Install Erlang + Elixir
        run: brew install elixir

      - name: Cache deps + _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-brew-${{ hashFiles('**/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-brew-

      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get
      - name: Tests (CoreMIDI)
        run: mix test --only macos_only
